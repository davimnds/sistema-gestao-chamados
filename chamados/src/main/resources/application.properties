spring.application.name=chamados

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:chamados_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o console do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: substitua por um segredo Base64 forte via variável de ambiente em produção.
app.jwt.secret=${JWT_SECRET:VGhpcy1kZWZhdWx0LWRldi1zZWNyZXQta2V5LWZvci1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}